const labels=['Front','Left','Right','Back'],states=['Idle','Run','Attack','Hurt','Death'];let mode=0,start=performance.now(),playing=true,frozen=0,slow=false,shield=false;const buttons=[];states.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{mode=i;start=performance.now();buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)))};buttons.push(b);controls.append(b)});const pause=document.createElement('button');pause.textContent='Pause';pause.onclick=()=>{playing=!playing;if(!playing)frozen=performance.now();else start+=performance.now()-frozen;pause.textContent=playing?'Pause':'Play'};controls.append(pause);for(const [text,set] of [['Slow motion',v=>slow=v],['Shield',v=>shield=v]]){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.onchange=()=>set(c.checked);l.append(c,text);controls.append(l)}let hero;const image=new Image();image.onload=()=>hero=MyrrenHero.create(image);image.src='/hero-approved-v1.png';function draw(t){const c=sheet.getContext('2d');c.clearRect(0,0,1200,390);c.imageSmoothingEnabled=false;c.fillStyle='#f0dfb9';c.font='20px system-ui';const now=(playing?t:frozen),clock=(now-start)/(slow?3:1);if(hero&&MyrrenArmour.ready){labels.forEach((name,i)=>{c.fillText(name,i*300+120,44);c.save();c.translate(i*300+150,337);c.scale(5,5);const o={dv:i===3?'u':i===1||i===2?'s':'d',f:i===1?-1:1,g:[3,3,3,3,shield?3:0,3],moving:mode===1};if(mode===2)o.swingAt=clock-clock%850;if(mode===3)o.hurtAt=clock-50;if(mode===4)o.deathAt=clock-clock%2000;hero.draw(c,0,0,o,clock);c.restore()});document.getElementById('status').textContent=states[mode]+' · original base artwork retained · gameplay and saves untouched'}requestAnimationFrame(draw)}requestAnimationFrame(draw);
