<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myrren · Armour fitting</title><style>body{margin:0;background:#13251f;color:#f0dfb9;font:16px system-ui}main{max-width:1440px;margin:auto;padding:28px}h1{font:32px Georgia;margin:0 0 10px}p{color:#b8c5b8;margin:8px 0 20px}.bar,.slots{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;background:#263e33;color:#f0dfb9;border:1px solid #6e805c;border-radius:8px;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#536850;border-color:#d9c58d}label{display:flex;align-items:center;gap:6px}.slots label{flex-direction:column;align-items:start;font-size:13px}.slots select{min-width:145px}canvas{display:block;width:100%;image-rendering:pixelated;background:#1c3127;border-radius:12px}footer{margin-top:18px;color:#a9b5aa;font-size:14px}.views{margin:0 0 18px}a{color:#d6c18b}</style><main><h1>Tales of Myrren · Armour fitting</h1><p>Seven armour sets using complete worn-character poses. Try full sets, remove pieces, or mix materials. This preview does not change your live save.</p><div class="bar views"><button id="allSets" aria-pressed="true">All seven sets</button><button id="fitting" aria-pressed="false">Fitting room</button><label>View <select id="direction"><option value="0">Front</option><option value="1">Left</option><option value="2">Right</option><option value="3">Back</option></select></label></div><div class="bar" id="actions"></div><div id="gearControls" hidden><div class="bar" id="presets"></div><div class="slots" id="slots"></div></div><canvas id="sheet" width="1400" height="360" aria-label="Armour animation preview"></canvas><footer id="status">Loading complete armour artwork…</footer></main><script src="/wardrobe-v5.js?v=5"></script><script src="/sword-actions-v1.js?v=1"></script><script src="/approved-character.js?v=8"></script><script src="/forged-swords-v1.js?v=3"></script><script>
const sheet=document.getElementById('sheet'),actions=document.getElementById('actions'),presets=document.getElementById('presets'),slots=document.getElementById('slots'),allSets=document.getElementById('allSets'),fitting=document.getElementById('fitting'),gearControls=document.getElementById('gearControls'),direction=document.getElementById('direction'),statusEl=document.getElementById('status');
const mats=[['None',0],['Bronze',2],['Iron',3],['Steel',4],['Black Iron',5],['Obsidianite',7],['Myrrenite',6],['Starsteel',8]],levels=[1,10,20,30,40,55,70],modes=['Idle','Run','Attack','Hurt','Death'],dirs=['Front','Left','Right','Back'];let mode=0,start=performance.now(),paused=false,frozen=0,slow=false,all=true,hero=null,gear=[3,3,3,3,3,3],dye=null,sword=3;const fields=[],buttons=[];
function clock(t){return paused?frozen:(t-start)/(slow?3:1)}function setMode(i){mode=i;start=performance.now();frozen=0;buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}modes.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>setMode(i);buttons.push(b);actions.append(b)});const pause=document.createElement('button');pause.textContent='Pause';pause.onclick=()=>{if(!paused){frozen=clock(performance.now());paused=true}else{start=performance.now()-frozen*(slow?3:1);paused=false}pause.textContent=paused?'Play':'Pause'};actions.append(pause);for(const delta of[-1,1]){const b=document.createElement('button');b.textContent=delta<0?'Previous frame':'Next frame';b.onclick=()=>{const age=clock(performance.now()),frame=mode===1?Math.floor(age/75)%6:Math.floor(age/75)%6,index=(frame+delta+6)%6;paused=true;pause.textContent='Play';frozen=mode===2?[0,55,100,150,220,280][index]:mode===4?[0,150,280,430,600,800][index]:index*75};actions.append(b)}const slowLabel=document.createElement('label'),slowBox=document.createElement('input');slowBox.type='checkbox';slowLabel.append(slowBox,'Slow motion');slowBox.onchange=()=>{const age=clock(performance.now());slow=slowBox.checked;start=performance.now()-age*(slow?3:1)};actions.append(slowLabel);
function view(v){all=v;allSets.setAttribute('aria-pressed',String(v));fitting.setAttribute('aria-pressed',String(!v));gearControls.hidden=v;sheet.width=v?1400:1200;sheet.height=360}allSets.onclick=()=>view(true);fitting.onclick=()=>view(false);
for(const [label,index]of[['Helmet',0],['Chest',1],['Gloves',5],['Legs',2],['Boots',3],['Shield',4]]){const l=document.createElement('label'),s=document.createElement('select');s.setAttribute('aria-label',label);for(const[name,value]of mats){const o=document.createElement('option');o.value=value;o.textContent=name;s.append(o)}s.value=gear[index];s.onchange=()=>gear[index]=+s.value;l.append(label,s);slots.append(l);fields.push([s,index])}function sync(){sword=gear[0]||0;weaponSelect.value=sword;fields.forEach(([s,i])=>s.value=gear[i]);view(false)}for(const[name,m]of mats.slice(1)){const b=document.createElement('button');b.textContent=name+' set';b.onclick=()=>{gear=[m,m,m,m,m,m];sync()};presets.append(b)}for(const[name,g]of[['Unequip all',[0,0,0,0,0,0]],['Mixed example',[8,5,7,3,6,4]]]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{gear=g.slice();sync()};presets.append(b)}const weaponLabel=document.createElement('label'),weaponSelect=document.createElement('select');weaponSelect.setAttribute('aria-label','Sword');for(const[name,value]of mats){const option=document.createElement('option');option.value=value;option.textContent=name;weaponSelect.append(option)}weaponSelect.value=sword;weaponSelect.onchange=()=>sword=+weaponSelect.value;weaponLabel.append('Sword',weaponSelect);slots.append(weaponLabel);const dyeLabel=document.createElement('label'),dyeSelect=document.createElement('select'),dyes=[null,{M:'#b02a2a',H:'#ee7a64',D:'#5a1414'},{M:'#2a8a4a',H:'#7ae09a',D:'#124a24'},{M:'#2a2e6a',H:'#7a84d8',D:'#10123a'},{M:'#c8a02a',H:'#fff0a0',D:'#6a4c10'}];['Original finish','Crimson','Emerald','Midnight','Royal gold'].forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;dyeSelect.append(o)});dyeSelect.onchange=()=>dye=dyes[+dyeSelect.value];dyeLabel.append('Dye · higher metal tiers',dyeSelect);slots.append(dyeLabel);
function draw(t){if(MyrrenWardrobe.ready&&!hero)hero=MyrrenHero.create(MyrrenWardrobe.base,{rawFrames:true});const x=sheet.getContext('2d');x.clearRect(0,0,sheet.width,sheet.height);x.imageSmoothingEnabled=false;x.fillStyle='#f0dfb9';x.font='17px system-ui';const age=clock(t);if(hero){const n=all?7:4;for(let i=0;i<n;i++){const dir=all?+direction.value:i,g=all?(()=>{const m=mats[i+1][1];return[m,m,m,m,m,m]})():gear;x.fillText(all?mats[i+1][0]+' · '+levels[i]:dirs[i],i*(sheet.width/n)+12,35);x.save();x.translate(i*(sheet.width/n)+sheet.width/n/2,309);x.scale(all||mode===4?3:4,all||mode===4?3:4);const o={dv:dir===3?'u':dir===1||dir===2?'s':'d',f:dir===1?-1:1,g,nativeScale:true,armourDye:dye,moving:mode===1};if(mode===2)o.swingAt=age-age%850;if(mode===3)o.hurtAt=age-50;if(mode===4)o.deathAt=age-age%2000;o.weaponMat=all?g[0]:sword;if(o.weaponMat)hero.drawEquipped(x,0,0,o,age);else hero.draw(x,0,0,o,age);x.restore()}statusEl.textContent=modes[mode]+' · '+(all?'All seven approved materials':fields.map(([s])=>s.getAttribute('aria-label')+': '+s.options[s.selectedIndex].textContent).join(' · '))}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
