<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myrren · Approved Armour Reference</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c27;color:#f3e6c7;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}p{color:#b7c0cf;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.tile{border:1px solid #777b83;border-radius:12px;padding:12px;text-align:center;background:#222a38}.tile canvas{width:100%;max-width:176px;image-rendering:pixelated}.tile h2{font-size:14px;margin:8px 0}.note{margin-top:24px}a{color:#b9dbff}
</style><main><h1>Approved Smithing Armour — Front Reference</h1><p>Read-only inspection of the seven approved designs. This page does not replace the in-game armour renderer, modify saves, or alter movement and combat animations.</p><section class="grid" id="grid"></section><p class="note" id="status">Loading approved atlas…</p></main>
<script>
const names=['Bronze','Iron','Steel','Black Iron','Obsidianite','Myrrenite','Starsteel'];
const img=new Image();img.onload=()=>{const width=img.naturalWidth/7,height=img.naturalHeight;const grid=document.querySelector('#grid');if(!Number.isInteger(width)){document.querySelector('#status').textContent='Unexpected atlas width: '+img.naturalWidth;return}names.forEach((name,i)=>{const tile=document.createElement('article');tile.className='tile';const title=document.createElement('h2');title.textContent=name;const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(img,i*width,0,width,height,0,0,width,height);tile.append(title,canvas);grid.append(tile)});document.querySelector('#status').textContent='Atlas loaded: '+img.naturalWidth+' × '+img.naturalHeight+' px; '+width+' × '+height+' px per tier. These are reference cutouts, not directional equipment layers.'};img.onerror=()=>document.querySelector('#status').textContent='Atlas could not be loaded. Check public/assets/kez-v2/smithing_armour_front_atlas.png';img.src='/assets/kez-v2/smithing_armour_front_atlas.png';
</script></html>
