<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myrren V31 — Sprite Preview</title><style>body{background:#171b21;color:#f4f2e9;font:16px system-ui;text-align:center;padding:24px}canvas{background:#7eaa70;image-rendering:pixelated;max-width:90vw;border:3px solid #4a5b43}button{font:inherit;margin:6px;padding:9px 14px;background:#334452;color:white;border:1px solid #8ba2aa;border-radius:8px}button:focus{outline:2px solid white}p{max-width:560px;margin:16px auto}</style></head><body><h1>Approved V31 Character Preview</h1><p>Standalone test of the exact 32×40 atlas. The live game is not affected.</p><canvas id="stage" width="384" height="320"></canvas><div><button id="idle">Idle</button><button id="walk">Walk</button><button id="size">Native 32×40</button></div><div><button data-dir="0">Front</button><button data-dir="1">Left</button><button data-dir="2">Right</button><button data-dir="3">Back</button></div><p id="status">Loading atlas…</p><script src="/v31-feet.js?v=1"></script><script>const c=document.getElementById('stage'),ctx=c.getContext('2d'),img=new Image(),status=document.getElementById('status');ctx.imageSmoothingEnabled=false;let feetAtlas=null;let dir=0,moving=true,actualSize=false;document.querySelector('#size').onclick=()=>{actualSize=!actualSize;document.querySelector('#size').textContent=actualSize?'Enlarged preview':'Native 32×40'};document.querySelector('#idle').onclick=()=>moving=false;document.querySelector('#walk').onclick=()=>moving=true;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>dir=Number(b.dataset.dir));img.onload=()=>{feetAtlas=buildV31FeetAtlas(img);status.textContent=img.width===128&&img.height===320?'Sprite loaded — 32×40, four directions.':'Unexpected atlas size: '+img.width+'×'+img.height;requestAnimationFrame(tick)};img.onerror=()=>status.textContent='Sprite could not load';img.src='/hero_32x40_v31.png';function tick(t){ctx.clearRect(0,0,384,320);ctx.fillStyle='#6b965e';ctx.fillRect(0,220,384,100);ctx.fillStyle='#527a49';ctx.fillRect(0,222,384,3);const frame=moving?Math.floor(t/140)%4:0,row=dir+(moving?4:0);const w=actualSize?32:192,h=actualSize?40:240;const dx=192-w/2,dy=actualSize?220-h:32;ctx.drawImage(feetAtlas,frame*32,row*40,32,40,dx,dy,w,h);requestAnimationFrame(tick)}</script></body></html>
