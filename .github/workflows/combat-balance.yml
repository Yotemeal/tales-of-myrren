name: Combat balance regression
on:
  pull_request:
    paths:
      - 'public/myrren-game.js'
      - 'public/myrren-ui.css'
      - 'public/index.html'
      - 'tests/combat-balance-audit.test.cjs'
      - 'tests/combat-input.test.cjs'
      - 'tests/combat-feedback.test.cjs'
      - 'tests/combat-overlay-layout.test.cjs'
      - 'tests/combat-telegraph.test.cjs'
      - 'tests/skill-xp-drops.test.cjs'
      - 'tests/smithing-batch.test.cjs'
      - 'tests/xp-progression-balance.test.cjs'
      - 'tests/mining-feedback-respawn.test.cjs'
      - 'tests/cooking-fishing-workflow.test.cjs'
      - 'tests/forestry-feedback-regrowth.test.cjs'
      - 'tests/skilling-loop-audit.test.cjs'
      - 'tests/game-runtime.cjs'
      - '.github/workflows/combat-balance.yml'
  push:
    branches:
      - 'main'
      - 'balance/combat-audit-2026-11'
    paths:
      - 'public/myrren-game.js'
      - 'tests/combat-balance-audit.test.cjs'
      - 'tests/combat-feedback.test.cjs'
      - 'tests/combat-overlay-layout.test.cjs'
      - 'tests/combat-telegraph.test.cjs'
      - 'tests/skill-xp-drops.test.cjs'
      - 'tests/smithing-batch.test.cjs'
      - 'tests/xp-progression-balance.test.cjs'
      - 'tests/mining-feedback-respawn.test.cjs'
      - 'tests/cooking-fishing-workflow.test.cjs'
      - 'tests/forestry-feedback-regrowth.test.cjs'
      - 'tests/skilling-loop-audit.test.cjs'
      - '.github/workflows/combat-balance.yml'
jobs:
  combat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check public/myrren-game.js && node --check tests/combat-balance-audit.test.cjs && node --check tests/combat-input.test.cjs && node --check tests/combat-feedback.test.cjs && node --check tests/combat-overlay-layout.test.cjs && node --check tests/combat-telegraph.test.cjs && node --check tests/skill-xp-drops.test.cjs && node --check tests/smithing-batch.test.cjs && node --check tests/xp-progression-balance.test.cjs && node --check tests/mining-feedback-respawn.test.cjs && node --check tests/cooking-fishing-workflow.test.cjs && node --check tests/forestry-feedback-regrowth.test.cjs && node --check tests/skilling-loop-audit.test.cjs
      - name: Combat parity and balance baseline
        run: node tests/combat-balance-audit.test.cjs
      - name: Target locking and attack input behaviour
        run: node tests/combat-input.test.cjs
      - name: Visual hit feedback and recoil
        run: node tests/combat-feedback.test.cjs
      - name: Crowded combat readability
        run: node tests/combat-overlay-layout.test.cjs
      - name: Opt-in boss and mob attack warnings
        run: node tests/combat-telegraph.test.cjs
      - name: Skill and combat kill XP drops
        run: node tests/skill-xp-drops.test.cjs
      - name: Furnace and anvil batch-production safety
        run: node tests/smithing-batch.test.cjs
      - name: Cross-skill XP progression and boss reward parity
        run: node tests/xp-progression-balance.test.cjs
      - name: Mining feedback, respawns and inspect-only tapping
        run: node tests/mining-feedback-respawn.test.cjs
      - name: Cooking and fishing workflows
        run: node tests/cooking-fishing-workflow.test.cjs
      - name: Forestry chopping effects, regrowth and inspect-only taps
        run: node tests/forestry-feedback-regrowth.test.cjs
      - name: Skill supply limits and resource selection audit
        run: node tests/skilling-loop-audit.test.cjs
