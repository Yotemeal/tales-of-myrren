name: Combat balance regression
on:
  pull_request:
    paths:
      - 'public/myrren-game.js'
      - 'tests/combat-balance-audit.test.cjs'
      - 'tests/combat-input.test.cjs'
      - 'tests/combat-feedback.test.cjs'
      - 'tests/combat-overlay-layout.test.cjs'
      - 'tests/game-runtime.cjs'
      - '.github/workflows/combat-balance.yml'
  push:
    branches:
      - 'main'
      - 'balance/combat-audit-2026-11'
    paths:
      - 'public/myrren-game.js'
      - 'tests/combat-balance-audit.test.cjs'
      - 'tests/combat-feedback.test.cjs'
      - 'tests/combat-overlay-layout.test.cjs'
      - '.github/workflows/combat-balance.yml'
jobs:
  combat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check public/myrren-game.js && node --check tests/combat-balance-audit.test.cjs && node --check tests/combat-input.test.cjs && node --check tests/combat-feedback.test.cjs && node --check tests/combat-overlay-layout.test.cjs
      - name: Combat parity and balance baseline
        run: node tests/combat-balance-audit.test.cjs
      - name: Target locking and attack input behaviour
        run: node tests/combat-input.test.cjs
      - name: Visual hit feedback and recoil
        run: node tests/combat-feedback.test.cjs
      - name: Crowded combat readability
        run: node tests/combat-overlay-layout.test.cjs
