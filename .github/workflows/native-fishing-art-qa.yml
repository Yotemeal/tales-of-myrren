name: Native fishing sprite art QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/assets/fishing/fishing_spots_v1.png'
      - 'public/assets/fishing/fishing_spots_v1.json'
      - 'tests/fishing-sprites-v1.test.py'
      - 'tests/fishing-v1-browser-visual.test.cjs'
      - 'scripts/preview-fishing-spots-v1.py'
      - '.github/workflows/native-fishing-art-qa.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-art:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated native-art QA environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/myrren-fishing-v1"
          "${RUNNER_TEMP}/myrren-fishing-v1/bin/python" -m pip install 'Pillow>=11,<13'
      - name: Validate every transparent PNG frame
        run: "${RUNNER_TEMP}/myrren-fishing-v1/bin/python tests/fishing-sprites-v1.test.py"
      - name: Produce labelled visual review sheet and loop
        run: "${RUNNER_TEMP}/myrren-fishing-v1/bin/python scripts/preview-fishing-spots-v1.py --out /tmp/myrren-fishing-art-review"
      - name: Upload original PNG and review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-original-png-art-review-not-integrated
          path: |
            public/assets/fishing/fishing_spots_v1.png
            public/assets/fishing/fishing_spots_v1.json
            /tmp/myrren-fishing-art-review/
          if-no-files-found: warn

  browser-review:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Capture actual game fishing spots before and after PNG proof
        run: node tests/fishing-v1-browser-visual.test.cjs
      - name: Upload actual game visual proof, not integrated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-real-game-before-after-review-only
          path: /tmp/myrren-native-fishing-browser-qa/
          if-no-files-found: warn
