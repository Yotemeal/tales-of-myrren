name: Mainline game integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/mainline-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/mainline-integrity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deployment asset contracts
        run: |
          node --check public/myrren-game.js
          node --check public/myrren-world.js
          node --check public/myrren-environment.js
          node --check src/worker.js
          node --test tests/ore-v31-native.test.cjs
          node tests/mainline-asset-contract.test.cjs
          node tests/vignette-cache.test.cjs
          node tests/minimap-removal.test.cjs
          node tests/canonical-delivery.test.cjs
      - name: Approved V19B pixel-lock and game renderer compatibility
        run: |
          node --check public/myrren-v19b-atlas.js
          node --check public/myrren-v19b-optin-game-bridge.js
          node --test \
            tests/myrren-v19b-assets.test.cjs \
            tests/myrren-v19b-renderer.test.cjs \
            tests/myrren-v19b-pixel-lock.test.cjs \
            tests/myrren-v19b-optin-game-bridge.test.cjs \
            tests/myrren-v19b-production-bridge.test.cjs \
            tests/myrren-v19b-game-composition.test.cjs \
            tests/myrren-v19b-production-entry.test.cjs
      - name: V19F native face and eye pixel integrity (review only)
        run: |
          node --check scripts/build-v19f-review.cjs
          node --check public/myrren-v19f-atlas.js
          node --test tests/myrren-v19f-review-assets.test.cjs
      - name: Export exact V19F review PNGs
        run: node scripts/build-v19f-review.cjs /tmp/myrren-v19f-native-review
      - name: Archive V19F review-only sheets
        uses: actions/upload-artifact@v4
        with:
          name: myrren-v19f-four-direction-native-review
          path: /tmp/myrren-v19f-native-review/*.png
          if-no-files-found: warn
      - name: Gameplay, economy and save integrity
        run: |
          node tests/forging-skill.test.cjs
          node tests/armour-progression.test.cjs
          node tests/inventory-capacity.cjs
          node tests/save-inventory.test.cjs
          node tests/save-restore-session.test.cjs
          node tests/save-import-validation.test.cjs
          node tests/cloud-startup-recovery.test.cjs
          node tests/save-write-order.test.cjs
          node tests/combat-kiting.test.cjs
          node tests/cross-tab-save.test.cjs
          node tests/bank-notes.test.cjs
          node tests/combat-kill-xp.test.cjs
          node tests/movement-speed.test.cjs
          node tests/respawn-input.test.cjs
          node tests/jobs-progression.test.cjs
          node tests/village-layout.test.cjs

  mobile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Verify V3.1 mining sprites in real Chromium (fixed 2x)
        run: node tests/ore-v31-browser.cjs
      - name: Validate live public entry in portrait and landscape
        run: |
          node tests/mainline-mobile-hud.test.cjs
          node tests/keyboard-interface-browser.test.cjs
      - name: Keep mobile screenshot references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myrren-mobile-hud-qa
          path: |
            /tmp/myrren-ore-v31-2x-preview.png
            /tmp/myrren-portrait-hud.png
            /tmp/myrren-portrait-equipment.png
            /tmp/myrren-landscape-hud.png
            /tmp/myrren-landscape-equipment.png
          if-no-files-found: warn
