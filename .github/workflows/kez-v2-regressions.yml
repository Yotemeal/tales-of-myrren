name: Kez V2 renderer and gameplay integrity

on:
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/kez-v2-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/kez-v2-regressions.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/kez-v2-atlas.js
          node --check public/kez-v2-equipment.js
          node --check public/myrren-game.js
          node --check public/approved-character.js
          node --check public/wardrobe-v5.js
          node --check public/sword-actions-v1.js
      - name: Native Kez V2 rendering contracts
        run: node tests/kez-v2-rendering.test.cjs
      - name: Save, balance and gameplay regressions
        run: |
          node tests/armour-progression.test.cjs
          node tests/forging-skill.test.cjs
          node tests/inventory-capacity.cjs
          node tests/save-inventory.test.cjs
          node tests/bank-notes.test.cjs
          node tests/movement-speed.test.cjs
          node tests/combat-kill-xp.test.cjs

  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native test canvas
        run: npm install --no-save --no-package-lock @napi-rs/canvas
      - name: Verify approved armour and existing character assets
        run: |
          node tests/approved-character.test.cjs
          node tests/wardrobe-v5.test.cjs
          node tests/shields-approved.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify real 390x844 game and produce visual screenshots
        run: node tests/kez-v2-browser.test.cjs
      - name: Save visual QA snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kez-v2-mobile-and-seven-metals
          path: |
            /tmp/myrren-kez-v2-mobile.png
            /tmp/myrren-kez-v2-equipment.png
            /tmp/myrren-kez-v2-seven-metals.png
            /tmp/myrren-kez-v2-directions.png
            /tmp/myrren-kez-v2-myrrenite-helmet.png
            public/assets/kez-v2/kez_v2_atlas.png
            /tmp/myrren-kez-v2-dyes.png
          if-no-files-found: warn
