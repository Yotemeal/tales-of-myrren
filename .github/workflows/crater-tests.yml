name: Crater preview tests
on:
  push:
    branches:
      - plan/crater-creatures-and-skilling-pets
  pull_request:
    paths:
      - 'src/crater-*.mjs'
      - 'public/crater-*.js'
      - 'public/myrren-game.js'
      - 'tests/crater-*'
      - '.github/workflows/crater-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/myrren-game.js
      - run: node --check public/crater-loot-preview.js
      - run: node --check public/crater-loot-tables.js
      - run: node --check public/crater-loot-inventory.js
      - run: node --check public/crater-boss-rewards.js
      - run: node --check public/crater-boss-reward-schema.js
      - run: node --check src/crater-loot.mjs
      - run: node --check src/crater-kill-rewards.mjs
      - run: node --test tests/crater-loot*.test.* tests/crater-boss-rewards.test.cjs tests/crater-boss-reward-schema.test.cjs tests/crater-kill-rewards.test.mjs
