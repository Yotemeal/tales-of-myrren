name: Native Crater Camp prop art QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/assets/camp/camp_props_v1.png'
      - 'public/assets/camp/camp_props_v1.json'
      - 'tests/native-camp-props-v1.test.py'
      - 'scripts/preview-native-camp-props-v1.py'
      - '.github/workflows/native-camp-props-v1.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pixel-art:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated image QA
        run: |
          python3 -m venv "${RUNNER_TEMP}/myrren-camp-art"
          "${RUNNER_TEMP}/myrren-camp-art/bin/python" -m pip install 'Pillow>=11,<13'
      - name: Validate original sprite cells, alpha and static anchors
        run: "${RUNNER_TEMP}/myrren-camp-art/bin/python tests/native-camp-props-v1.test.py"
      - name: Build original-pixel contact sheet and animation
        run: "${RUNNER_TEMP}/myrren-camp-art/bin/python scripts/preview-native-camp-props-v1.py --out /tmp/myrren-camp-props-qa"
      - name: Upload review-only native art pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crater-camp-props-native-png-review-not-installed
          path: |
            public/assets/camp/camp_props_v1.png
            public/assets/camp/camp_props_v1.json
            /tmp/myrren-camp-props-qa/
          if-no-files-found: warn
