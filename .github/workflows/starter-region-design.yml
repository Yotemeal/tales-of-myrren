name: Starter region art and map design contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'design/starter-region-v1.json'
      - 'design/validate-starter-region.cjs'
      - 'docs/STARTER_REGION_ASSET_HANDOFF_2026-11-12.md'
      - '.github/workflows/starter-region-design.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check approved story, resources and player scale
        run: node design/validate-starter-region.cjs
