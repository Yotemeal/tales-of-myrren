name: Forging regression checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/myrren-game.js'
      - 'tests/forging-skill.test.cjs'
      - '.github/workflows/forging-checks.yml'
  push:
    branches:
      - 'balance/250-ehp-launch-skills'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  forging:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check public/myrren-game.js
      - name: Forging regression contracts
        run: node tests/forging-skill.test.cjs
      - name: Core save and inventory regression
        run: |
          node tests/inventory-capacity.cjs
          node tests/save-inventory.test.cjs
          node tests/bank-notes.test.cjs
